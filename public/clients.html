<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients · GroomCal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Clients</h1>
          <p class="subtitle">Owners, pets, and contact info</p>
        </div>
        <button class="btn btn-primary" id="newClientBtn">+ Add Client</button>
      </div>

      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by name, phone, or email...">
      </div>

      <div class="client-list" id="clientList"></div>
    </main>
  </div>

  <!-- Client create / edit -->
  <div class="modal-overlay hidden" id="clientModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="clientModalTitle">Add Client</h2>
        <button class="close-btn" data-close="clientModal">&times;</button>
      </div>
      <form id="clientForm">
        <div class="modal-body">
          <div class="form-error-banner" id="clientFormError"></div>

          <div class="form-row">
            <div class="form-group">
              <label for="c_firstName">First name</label>
              <input type="text" id="c_firstName" required>
            </div>
            <div class="form-group">
              <label for="c_lastName">Last name</label>
              <input type="text" id="c_lastName" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="c_phone">Phone</label>
              <input type="tel" id="c_phone">
            </div>
            <div class="form-group">
              <label for="c_email">Email</label>
              <input type="email" id="c_email">
            </div>
          </div>
          <div class="form-group">
            <label for="c_address">Address</label>
            <input type="text" id="c_address">
          </div>
          <div class="form-group">
            <label for="c_notes">Notes</label>
            <textarea id="c_notes" placeholder="Allergies, preferences, behavior notes..."></textarea>
          </div>

          <div id="petsSection" style="display:none">
            <label>Pets</label>
            <div id="petList"></div>
            <div class="form-row" style="margin-top:8px; align-items:flex-end;">
              <div class="form-group">
                <input type="text" id="p_name" placeholder="Pet name">
              </div>
              <div class="form-group">
                <input type="text" id="p_breed" placeholder="Breed">
              </div>
              <div class="form-group">
                <input type="text" id="p_size" placeholder="Size">
              </div>
              <button type="button" class="btn btn-secondary btn-sm" id="addPetBtn" style="margin-bottom:14px;">Add Pet</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="footer-left">
            <button type="button" class="btn btn-danger" id="clientDeleteBtn" style="display:none;">Delete Client</button>
          </div>
          <button type="button" class="btn btn-secondary" data-close="clientModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="clientSaveBtn">Save Client</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/clients.js"></script>
</body>
</html>
