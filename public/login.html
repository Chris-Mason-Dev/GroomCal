<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · GroomCal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">GC</div>
      <div class="brand-name">GroomCal</div>
      <div class="brand-sub">Shared calendar &amp; client manager</div>
    </div>

    <div class="form-error-banner" id="errorBanner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
    </form>

    <p class="hint-text">Default logins: <strong>groomer1</strong> / <strong>groomer2</strong>, password <strong>ChangeMe123!</strong> — change these after your first login.</p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
